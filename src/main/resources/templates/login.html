<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Service Manager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 8px;
        }
        .brand-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .brand-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-label {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 14px;
        }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            padding: 10px 14px;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 3px rgba(15,52,96,0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            width: 100%;
            color: white;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #16213e, #0f3460);
            color: white;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo-icon">🔧</div>
    <div class="brand-title">Car Service Manager</div>
    <div class="brand-subtitle">Manage your service shop efficiently</div>

    <div th:if="${param.error}" class="alert alert-danger py-2 mb-3" style="font-size:14px;">
        Username sau parola incorecte!
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 mb-3" style="font-size:14px;">
        Ai fost delogat cu succes!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-login">LOG IN</button>
    </form>
</div>
</body>
</html>
