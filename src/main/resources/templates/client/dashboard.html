<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; margin: 0; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%); min-height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .title { color: white; font-weight: 700; font-size: 16px; margin-left: 8px; }
        .sidebar-nav { padding: 16px 0; }
        .nav-item { padding: 12px 20px; color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { margin-left: 240px; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .topbar-user { display: flex; align-items: center; gap: 12px; color: #555; font-size: 14px; }
        .btn-logout { background: #f0f2f5; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #333; cursor: pointer; }
        .content-area { padding: 32px; }
        .table-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .section-title { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
        .vehicle-item { padding: 12px; border-radius: 8px; background: #f8f9ff; margin-bottom: 8px; font-size: 14px; color: #1a1a2e; }
        .table th { font-size: 12px; text-transform: uppercase; color: #888; border: none; }
        .table td { font-size: 14px; border-color: #f0f2f5; vertical-align: middle; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand d-flex align-items-center">
        <span style="font-size:24px;">🔧</span>
        <span class="title">Car Service Manager</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/client/dashboard" class="nav-item active"><span class="icon">📊</span> Dashboard</a>
        <a href="/client/appointments" class="nav-item"><span class="icon">📅</span> Programarile Mele</a>
    </nav>
</div>
<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Client Dashboard</div>
        <div class="topbar-user">
            <span>👤 Client</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
    <div class="content-area">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="table-card">
                    <div class="section-title">🚗 Vehiculele Mele</div>
                    <div th:each="vehicle : ${vehicles}" class="vehicle-item">
                        🚗 <span th:text="${vehicle.brand + ' ' + vehicle.model + ' (' + vehicle.licensePlate + ')'}"></span>
                    </div>
                    <div th:if="${#lists.isEmpty(vehicles)}" style="color:#aaa; font-size:14px;">Nu ai vehicule inregistrate.</div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="section-title mb-0">📅 Programarile Mele</div>
                        <a href="/client/appointments/add" class="btn btn-primary btn-sm" style="border-radius:8px; background:#0f3460; border:none;">+ Programare Noua</a>
                    </div>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Data</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td th:text="${appointment.date}"></td>
                            <td><span th:text="${appointment.status}" class="badge" th:classappend="${appointment.status == 'Confirmata'} ? 'bg-success' : 'bg-warning text-dark'"></span></td>
                        </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(appointments)}" style="color:#aaa; font-size:14px;">Nu ai programari.</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
