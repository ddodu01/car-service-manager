<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalii Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; margin: 0; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%); min-height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .title { color: white; font-weight: 700; font-size: 16px; margin-left: 8px; }
        .sidebar-nav { padding: 16px 0; }
        .nav-item { padding: 12px 20px; color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { margin-left: 240px; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .topbar-user { display: flex; align-items: center; gap: 12px; color: #555; font-size: 14px; }
        .btn-logout { background: #f0f2f5; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #333; cursor: pointer; }
        .content-area { padding: 32px; }
        .invoice-card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 600px; }
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid #f0f2f5; }
        .invoice-brand { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .invoice-number { font-size: 13px; color: #888; margin-top: 4px; }
        .badge-emisa { background: #e8f5e9; color: #2e7d32; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f2f5; }
        .detail-label { font-size: 13px; color: #888; }
        .detail-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
        .total-row { display: flex; justify-content: space-between; padding: 16px 0; margin-top: 8px; }
        .total-label { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .total-value { font-size: 20px; font-weight: 700; color: #0f3460; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand d-flex align-items-center">
        <span style="font-size:24px;">🔧</span>
        <span class="title">Car Service Manager</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/receptionist/dashboard" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="/receptionist/clients" class="nav-item"><span class="icon">👥</span> Clienti</a>
        <a href="/receptionist/vehicles" class="nav-item"><span class="icon">🚗</span> Vehicule</a>
        <a href="/receptionist/appointments" class="nav-item"><span class="icon">📅</span> Programari</a>
        <a href="/receptionist/invoices" class="nav-item active"><span class="icon">📄</span> Facturi</a>
    </nav>
</div>
<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Detalii Factura</div>
        <div class="topbar-user">
            <span>👤 Receptioner</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
    <div class="content-area">
        <div class="invoice-card">
            <div class="invoice-header">
                <div>
                    <div class="invoice-brand">🔧 Car Service Manager</div>
                    <div class="invoice-number">Factura #<span th:text="${invoice.invoiceNumber}"></span></div>
                </div>
                <span class="badge-emisa" th:text="${invoice.status}"></span>
            </div>
            <div class="detail-row"><div class="detail-label">Data</div><div class="detail-value" th:text="${invoice.date}"></div></div>
            <div class="detail-row"><div class="detail-label">ID Reparatie</div><div class="detail-value" th:text="${invoice.repair.id}"></div></div>
            <div class="total-row">
                <div class="total-label">Total</div>
                <div class="total-value" th:text="${invoice.total} + ' RON'"></div>
            </div>
            <a href="/receptionist/invoices" class="btn btn-outline-secondary mt-3" style="border-radius:8px;">← Inapoi</a>
        </div>
    </div>
</div>
</body>
</html>
