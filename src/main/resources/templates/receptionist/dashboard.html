<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receptioner Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; margin: 0; }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .sidebar-brand {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-brand .title {
            color: white;
            font-weight: 700;
            font-size: 16px;
            margin-left: 8px;
        }
        .sidebar-nav { padding: 16px 0; flex: 1; }
        .nav-item {
            padding: 12px 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { margin-left: 240px; }
        .topbar {
            background: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .topbar-user { display: flex; align-items: center; gap: 12px; color: #555; font-size: 14px; }
        .btn-logout {
            background: #f0f2f5;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .btn-logout:hover { background: #e0e0e0; }
        .content-area { padding: 32px; }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .stat-label { font-size: 13px; color: #888; margin-bottom: 4px; }
        .stat-card .stat-value { font-size: 36px; font-weight: 700; color: #1a1a2e; }
        .stat-card .stat-sub { font-size: 12px; color: #aaa; margin-top: 4px; }
        .stat-card .stat-icon { font-size: 32px; float: right; margin-top: -8px; }
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand d-flex align-items-center">
        <span style="font-size:24px;">🔧</span>
        <span class="title">Car Service Manager</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/receptionist/dashboard" class="nav-item active">
            <span class="icon">📊</span> Dashboard
        </a>
        <a href="/receptionist/clients" class="nav-item">
            <span class="icon">👥</span> Clienti
        </a>
        <a href="/receptionist/vehicles" class="nav-item">
            <span class="icon">🚗</span> Vehicule
        </a>
        <a href="/receptionist/appointments" class="nav-item">
            <span class="icon">📅</span> Programari
        </a>
        <a href="/receptionist/invoices" class="nav-item">
            <span class="icon">📄</span> Facturi
        </a>
    </nav>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Receptioner Dashboard</div>
        <div class="topbar-user">
            <span>👤 Receptioner</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>

    <div class="content-area">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-icon">👥</span>
                    <div class="stat-label">Total Clienti</div>
                    <div class="stat-value" th:text="${totalClienti}">0</div>
                    <div class="stat-sub">Inregistrati</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-icon">📅</span>
                    <div class="stat-label">Programari</div>
                    <div class="stat-value" th:text="${programari}">0</div>
                    <div class="stat-sub">Total</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-label">Reparatii Active</div>
                    <div class="stat-value" th:text="${reparatiiActive}">0</div>
                    <div class="stat-sub">In progres</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="section-title">Actiuni Rapide</div>
            <div class="d-flex gap-3 flex-wrap">
                <a href="/receptionist/clients/add" class="btn btn-primary" style="border-radius:8px;">+ Adauga Client</a>
                <a href="/receptionist/vehicles/add" class="btn btn-outline-primary" style="border-radius:8px;">+ Adauga Vehicul</a>
                <a href="/receptionist/appointments" class="btn btn-outline-secondary" style="border-radius:8px;">Vezi Programari</a>
                <a href="/receptionist/invoices" class="btn btn-outline-secondary" style="border-radius:8px;">Vezi Facturi</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
