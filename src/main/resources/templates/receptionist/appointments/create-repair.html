<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Creeaza Reparatie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; margin: 0; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%); min-height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .title { color: white; font-weight: 700; font-size: 16px; margin-left: 8px; }
        .sidebar-nav { padding: 16px 0; }
        .nav-item { padding: 12px 20px; color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { margin-left: 240px; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .topbar-user { display: flex; align-items: center; gap: 12px; color: #555; font-size: 14px; }
        .btn-logout { background: #f0f2f5; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #333; cursor: pointer; }
        .content-area { padding: 32px; }
        .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 600px; }
        .info-card { background: #f8f9ff; border-radius: 12px; padding: 20px; margin-bottom: 24px; border-left: 4px solid #0f3460; max-width: 600px; }
        .info-label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
        .form-label { font-weight: 600; color: #1a1a2e; font-size: 14px; }
        .form-control, .form-select { border-radius: 8px; border: 1.5px solid #e0e0e0; font-size: 14px; padding: 10px 14px; }
        .form-control:focus, .form-select:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.1); }
        .btn-primary { background: #0f3460; border: none; border-radius: 8px; padding: 10px 24px; }
        .btn-secondary { border-radius: 8px; padding: 10px 24px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand d-flex align-items-center">
        <span style="font-size:24px;">🔧</span>
        <span class="title">Car Service Manager</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/receptionist/dashboard" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="/receptionist/clients" class="nav-item"><span class="icon">👥</span> Clienti</a>
        <a href="/receptionist/vehicles" class="nav-item"><span class="icon">🚗</span> Vehicule</a>
        <a href="/receptionist/appointments" class="nav-item active"><span class="icon">📅</span> Programari</a>
        <a href="/receptionist/invoices" class="nav-item"><span class="icon">📄</span> Facturi</a>
    </nav>
</div>
<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Creeaza Reparatie</div>
        <div class="topbar-user">
            <span>👤 Receptioner</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
    <div class="content-area">
        <div class="info-card">
            <div class="row">
                <div class="col-md-4">
                    <div class="info-label">Client</div>
                    <div class="info-value" th:text="${appointment.client.name + ' ' + appointment.client.surname}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Data</div>
                    <div class="info-value" th:text="${appointment.date}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Problema</div>
                    <div class="info-value" th:text="${appointment.description}"></div>
                </div>
            </div>
        </div>
        <div class="form-card">
            <form th:action="@{/receptionist/appointments/create-repair/{id}(id=${appointment.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Vehicul</label>
                    <select class="form-select" name="vehicleId" required>
                        <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.brand + ' ' + vehicle.model + ' (' + vehicle.licensePlate + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descriere Reparatie</label>
                    <textarea class="form-control" name="description" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Asigneaza Mecanic</label>
                    <select class="form-select" name="employeeId" required>
                        <option th:each="mechanic : ${mechanics}" th:value="${mechanic.id}" th:text="${mechanic.name + ' ' + mechanic.surname}"></option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Creeaza Reparatie</button>
                    <a href="/receptionist/appointments" class="btn btn-secondary">Anuleaza</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
