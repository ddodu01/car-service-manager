<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalii Reparatie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; margin: 0; }
        .sidebar { width: 240px; background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%); min-height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand .title { color: white; font-weight: 700; font-size: 16px; margin-left: 8px; }
        .sidebar-nav { padding: 16px 0; }
        .nav-item { padding: 12px 20px; color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { margin-left: 240px; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .topbar-user { display: flex; align-items: center; gap: 12px; color: #555; font-size: 14px; }
        .btn-logout { background: #f0f2f5; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #333; cursor: pointer; }
        .content-area { padding: 32px; }
        .detail-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .section-title { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
        .detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid #f0f2f5; }
        .detail-label { font-size: 13px; color: #888; width: 160px; flex-shrink: 0; }
        .detail-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
        .form-control, .form-select { border-radius: 8px; border: 1.5px solid #e0e0e0; font-size: 14px; }
        .form-control:focus, .form-select:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.1); }
        .btn-primary { background: #0f3460; border: none; border-radius: 8px; }
        .btn-primary:hover { background: #1a1a2e; }
        .btn-success { border-radius: 8px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand d-flex align-items-center">
        <span style="font-size:24px;">🔧</span>
        <span class="title">Car Service Manager</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/mechanic/dashboard" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="/mechanic/repairs" class="nav-item active"><span class="icon">🔧</span> Reparatiile Mele</a>
    </nav>
</div>
<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Detalii Reparatie</div>
        <div class="topbar-user">
            <span>👤 Mecanic</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
    <div class="content-area">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div class="detail-card">
            <div class="section-title">Informatii Reparatie</div>
            <div class="detail-row">
                <div class="detail-label">Descriere</div>
                <div class="detail-value" th:text="${repair.description}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Status</div>
                <div class="detail-value">
                    <span th:text="${repair.status}" class="badge"
                          th:classappend="${repair.status == 'Finalizata'} ? 'bg-success' : (${repair.status == 'In lucru'} ? 'bg-warning text-dark' : 'bg-secondary')"></span>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Data Start</div>
                <div class="detail-value" th:text="${repair.startDate}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Data Final</div>
                <div class="detail-value" th:text="${repair.endDate}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Manopera</div>
                <div class="detail-value" th:text="${repair.manopera} + ' RON'"></div>
            </div>
        </div>

        <div class="detail-card">
            <div class="section-title">Actualizeaza Status</div>
            <form th:action="@{/mechanic/repairs/update-status/{id}(id=${repair.id})}" method="post">
                <div class="input-group" style="max-width: 400px;">
                    <select name="status" class="form-select">
                        <option value="In asteptare">In asteptare</option>
                        <option value="In lucru">In lucru</option>
                        <option value="Finalizata">Finalizata</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Actualizeaza</button>
                </div>
            </form>
        </div>

        <div class="detail-card">
            <div class="section-title">Actualizeaza Manopera</div>
            <form th:action="@{/mechanic/repairs/update-details/{id}(id=${repair.id})}" method="post">
                <div class="input-group" style="max-width: 400px;">
                    <span class="input-group-text">RON</span>
                    <input type="number" step="0.01" name="manopera" class="form-control"
                           th:value="${repair.manopera}" placeholder="0.00"/>
                    <button type="submit" class="btn btn-success">Salveaza</button>
                </div>
            </form>
        </div>

        <a href="/mechanic/repairs" class="btn btn-outline-secondary" style="border-radius:8px;">← Inapoi</a>
    </div>
</div>
</body>
</html>
